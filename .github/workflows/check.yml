name: C/C++ CI

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:

jobs:
  build:
    name: build (${{ matrix.build_type }}, DEV_ASSERT=${{ matrix.dev_assert }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            dev_assert: "ON"
          - build_type: Release
            dev_assert: "ON"
          - build_type: Release
            dev_assert: "OFF"

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: setup deps
      run: sudo apt-get update && sudo apt-get install -y libwpa-client-dev libnm-dev libudev-dev
    - name: configure
      run: cmake -S . -B build -DLIBXR_TEST_BUILD=ON -DLIBXR_DEV_ASSERT_BUILD=${{ matrix.dev_assert }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
    - name: make
      run: cd build && cmake --build . -j"$(nproc)"
    - name: automatic tests
      run: ctest --test-dir build --output-on-failure --no-tests=error

  clang-format:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install clang-format 21.1.8
      shell: bash
      run: |
        python3 -m venv .venv-clang-format
        .venv-clang-format/bin/python -m pip install --upgrade pip
        .venv-clang-format/bin/python -m pip install "clang-format==21.1.8"
        .venv-clang-format/bin/clang-format --version
    - name: check clang-format via script
      shell: bash
      run: |
        tools/format_cpp_files.sh --check

  cmake-format:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install cmake-format 0.6.13
      shell: bash
      run: |
        python3 -m venv .venv-cmake-format
        .venv-cmake-format/bin/python -m pip install --upgrade pip
        .venv-cmake-format/bin/python -m pip install "cmakelang[YAML]==0.6.13"
        .venv-cmake-format/bin/cmake-format --version
    - name: check cmake-format via script
      shell: bash
      run: |
        tools/format_cmake_files.sh --check
